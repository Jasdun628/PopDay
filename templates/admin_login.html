<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PopDay</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f5;
      --text: #202124;
      --muted: #63676c;
      --line: #d9d9d4;
      --panel: #ffffff;
      --danger: #b3261e;
      --danger-bg: #fce8e6;
      --accent: #2f6f9f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      padding: 18px 24px;
    }
    h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: 0; }
    p { margin: 4px 0 0; color: var(--muted); }
    main { max-width: 380px; margin: 60px auto; padding: 0 24px; }
    .login-card {
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 28px;
    }
    .login-card h2 { margin: 0 0 20px; font-size: 16px; font-weight: 650; }
    .error-msg {
      background: var(--danger-bg);
      color: var(--danger);
      font-size: 13px;
      margin-bottom: 16px;
      padding: 10px 12px;
    }
    label {
      color: var(--muted);
      display: grid;
      font-size: 12px;
      font-weight: 650;
      gap: 4px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }
    input[type=password] {
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--text);
      font: inherit;
      min-height: 36px;
      padding: 7px 8px;
      width: 100%;
    }
    input:focus { border-color: var(--accent); outline: 2px solid rgba(47,111,159,0.18); }
    button {
      background: #202124;
      border: 0;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 650;
      min-height: 36px;
      padding: 7px 11px;
      width: 100%;
    }
    button:hover { opacity: 0.86; }
    .back-link { margin-top: 16px; font-size: 13px; color: var(--muted); }
    .back-link a { color: var(--accent); }
  </style>
</head>
<body>
<header>
  <h1>PopDay</h1>
  <p>Admin sign in</p>
</header>
<main>
  <div class="login-card">
    <h2>Sign in</h2>
    {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}
    {% if not disabled %}
    <form method="post" autocomplete="off">
      <label>Password
        <input type="password" name="password" autofocus required>
      </label>
      <button type="submit">Sign in</button>
    </form>
    {% endif %}
  </div>
</main>
</body>
</html>
